<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fellowship Application | ConnectEd Research Institute</title>
    <meta name="description" content="Apply to ConnectEd Research Institute fellowships. Complete the application form with your academic profile and program selection.">
    <meta property="og:title" content="Fellowship Application | ConnectEd">
    <meta property="og:description" content="Begin your fellowship application to join a mentored research cohort.">
    <meta property="og:type" content="website">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page="programs">

    <div id="site-nav"></div>

    <header class="page-header">
        <h1>Fellowship Application</h1>
    </header>

    <section class="container">
        <a href="young-scholars.html" class="back-link">
            <i class="fas fa-chevron-left" aria-hidden="true"></i> Back
        </a>
        <div class="form-container">
            <form id="fellowshipForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <input type="hidden" name="_subject" value="New Fellowship Application">

                <div class="section-header"><h2>Applicant Profile</h2></div>
                <div class="form-group">
                    <label for="app-name">Full Name</label>
                    <input type="text" id="app-name" name="Full_Name" required>
                </div>
                <div class="form-group">
                    <label for="app-dob">Date of Birth</label>
                    <input type="date" id="app-dob" name="Date_of_Birth" required>
                </div>
                <div class="form-group">
                    <label for="app-nat">Nationality</label>
                    <input type="text" id="app-nat" name="Nationality" required>
                </div>

                <div class="section-header" style="margin-top: 40px;"><h2>Academic Record</h2></div>
                <div class="form-group">
                    <label for="app-inst">Current Institution</label>
                    <input type="text" id="app-inst" name="Institution" required>
                </div>
                <div class="form-group">
                    <label for="app-gpa-scale">GPA Scale</label>
                    <select id="app-gpa-scale" name="GPA_Scale">
                        <option>4.0</option>
                        <option>100</option>
                    </select>
                </div>

                <div class="section-header" style="margin-top: 40px;"><h2>Fellowship Choice</h2></div>
                <div class="form-group">
                    <label for="app-program">Program Selection</label>
                    <select id="app-program" name="Program_Selection">
                        <option>ConnectEd Young Scholars Fellowship</option>
                        <option>ConnectEd STEM Research Fellowship</option>
                    </select>
                </div>

                <div style="margin-top: 40px; padding: 20px; background: var(--lpi-gray-light);">
                    <div style="margin-bottom: 15px;">
                        <input type="checkbox" id="check1" class="agree-check" name="Confirms_Accuracy" value="yes">
                        <label for="check1" style="display:inline; margin-left:10px; text-transform:none; font-weight:500;">Confirm accuracy of information</label>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <input type="checkbox" id="check2" class="agree-check" name="Understands_Placement" value="yes">
                        <label for="check2" style="display:inline; margin-left:10px; text-transform:none; font-weight:500;">Understand placement is not guaranteed</label>
                    </div>
                    <div>
                        <input type="checkbox" id="check3" class="agree-check" name="Agrees_To_Contact" value="yes">
                        <label for="check3" style="display:inline; margin-left:10px; text-transform:none; font-weight:500;">Agree to be contacted</label>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit" style="margin-top: 30px;" disabled>Submit Formal Application</button>
            </form>
        </div>
    </section>

    <div id="site-footer"></div>

    <script src="assets/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checks = document.querySelectorAll('.agree-check');
            const submitBtn = document.getElementById('submitBtn');
            checks.forEach(check => {
                check.addEventListener('change', () => {
                    const allChecked = Array.from(checks).every(c => c.checked);
                    submitBtn.disabled = !allChecked;
                });
            });
        });
    </script>
</body>
</html>
