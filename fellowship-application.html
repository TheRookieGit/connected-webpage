<!DOCTYPE html>
<html lang="zh-CN" data-title-en="Fellowship Application | ConnectEd Research Institute">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fellowship 申请 | ConnectEd Research Institute</title>
    <meta name="description" content="Apply to ConnectEd Research Institute fellowships. Complete the application form with your academic profile and program selection.">
    <meta property="og:title" content="Fellowship Application | ConnectEd">
    <meta property="og:description" content="Begin your fellowship application to join a mentored research cohort.">
    <meta property="og:type" content="website">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page="programs">

    <div id="site-nav"></div>

    <header class="page-header page-header--image" style="--ph-image: url('https://images.unsplash.com/photo-1546410531-bb4caa6b424d?auto=format&amp;fit=crop&amp;q=80&amp;w=1800');">
        <span class="eyebrow" data-i18n data-en="Apply" data-zh-hash="kpb8">申请</span>
        <h1 data-i18n data-en="Fellowship application." data-zh-hash="ow46nz">Fellowship 申请。</h1>
        <p data-i18n data-en="Rolling review. Please have your academic transcripts and personal statement ready before beginning." data-zh-hash="3xo9pg">滚动审核。开始前请备好学业成绩单与个人陈述。</p>
    </header>

    <section>
        <div class="container">
        <a href="young-scholars.html" class="back-link" data-i18n data-en="Back to Fellowship" data-zh-hash="98hvzb">返回 Fellowship</a>
        <div class="form-container">
            <form id="fellowshipForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <input type="hidden" name="_subject" value="New Fellowship Application">

                <div class="section-header"><h2 data-i18n data-en="Applicant Profile" data-zh-hash="kzgzi4">申请人信息</h2></div>
                <div class="form-group">
                    <label for="app-name" data-i18n data-en="Full Name" data-zh-hash="fqmy">姓名</label>
                    <input type="text" id="app-name" name="Full_Name" required>
                </div>
                <div class="form-group">
                    <label for="app-dob" data-i18n data-en="Date of Birth" data-zh-hash="atvjsv">出生日期</label>
                    <input type="date" id="app-dob" name="Date_of_Birth" required>
                </div>
                <div class="form-group">
                    <label for="app-nat" data-i18n data-en="Nationality" data-zh-hash="fh80">国籍</label>
                    <input type="text" id="app-nat" name="Nationality" required>
                </div>

                <div class="section-header" style="margin-top: 40px;"><h2 data-i18n data-en="Academic Record" data-zh-hash="buwxl0">学业情况</h2></div>
                <div class="form-group">
                    <label for="app-inst" data-i18n data-en="Current Institution" data-zh-hash="p1eqnh">目前就读机构</label>
                    <input type="text" id="app-inst" name="Institution" required>
                </div>
                <div class="form-group">
                    <label for="app-gpa-scale" data-i18n data-en="GPA Scale" data-zh-hash="yvrdg8">GPA 制度</label>
                    <select id="app-gpa-scale" name="GPA_Scale">
                        <option data-opt-en="4.0">4.0</option>
                        <option data-opt-en="100">100</option>
                    </select>
                </div>

                <div class="section-header" style="margin-top: 40px;"><h2 data-i18n data-en="Fellowship Choice" data-zh-hash="cy4zb1">Fellowship 选择</h2></div>
                <div class="form-group">
                    <label for="app-program" data-i18n data-en="Program Selection" data-zh-hash="jqfolx">项目选择</label>
                    <select id="app-program" name="Program_Selection">
                        <option data-opt-en="ConnectEd Young Scholars Fellowship">ConnectEd 青年学者 Fellowship</option>
                        <option data-opt-en="ConnectEd STEM Research Fellowship">ConnectEd STEM 研究 Fellowship</option>
                    </select>
                </div>

                <div style="margin-top: 40px; padding: 20px; background: var(--lpi-gray-light);">
                    <div style="margin-bottom: 15px;">
                        <input type="checkbox" id="check1" class="agree-check" name="Confirms_Accuracy" value="yes">
                        <label for="check1" style="display:inline; margin-left:10px; text-transform:none; font-weight:500;" data-i18n data-en="Confirm accuracy of information" data-zh-hash="ez8dii">确认所填信息真实准确</label>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <input type="checkbox" id="check2" class="agree-check" name="Understands_Placement" value="yes">
                        <label for="check2" style="display:inline; margin-left:10px; text-transform:none; font-weight:500;" data-i18n data-en="Understand placement is not guaranteed" data-zh-hash="sxlkm2">理解岗位匹配不作保证</label>
                    </div>
                    <div>
                        <input type="checkbox" id="check3" class="agree-check" name="Agrees_To_Contact" value="yes">
                        <label for="check3" style="display:inline; margin-left:10px; text-transform:none; font-weight:500;" data-i18n data-en="Agree to be contacted" data-zh-hash="vo4w5g">同意接受我们的联络</label>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit" style="margin-top: 30px;" disabled data-i18n data-en="Submit Formal Application" data-zh-hash="nyxy4c">正式提交申请</button>
            </form>
        </div>
        </div>
    </section>

    <div id="site-footer"></div>

    <script src="assets/lang.js"></script>
    <script src="assets/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checks = document.querySelectorAll('.agree-check');
            const submitBtn = document.getElementById('submitBtn');
            checks.forEach(check => {
                check.addEventListener('change', () => {
                    const allChecked = Array.from(checks).every(c => c.checked);
                    submitBtn.disabled = !allChecked;
                });
            });
        });
    </script>
</body>
</html>
