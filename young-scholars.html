<head>

    <title>青年学者 Fellowship | ConnectEd Research Institute</title>
    <meta name="description" content="The Young Scholars Fellowship supports academically strong high school students and early undergraduates with structured, mentored research experiences.">
    <meta property="og:title" content="Young Scholars Fellowship | ConnectEd">
    <meta property="og:description" content="A supportive environment for early scholars to build foundational research and analytical skills.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page="programs">

    <div id="site-nav"></div>

    <header class="page-header page-header--image" style="--ph-image: url('https://images.unsplash.com/photo-1523240715632-d984bc4a7956?auto=format&amp;fit=crop&amp;q=80&amp;w=1800');">
        <span class="eyebrow" data-i18n data-en="Fellowship Track" data-zh-hash="cxxp9x">Fellowship 方向</span>
        <h1 data-i18n data-en="Young Scholars Fellowship." data-zh-hash="gyk4n4">青年学者 Fellowship。</h1>
        <p data-i18n data-en="A structured, mentored environment for advanced high school students and early undergraduates entering real research for the first time." data-zh-hash="e7114b">为初次进入真实科研的优秀高中生与低年级本科生提供的结构化导师制学习环境。</p>
    </header>

    <section>
        <div class="container">
            <a href="fellowship-tracks.html" class="back-link" data-i18n data-en="Back to Fellowship Tracks" data-zh-hash="nbr28v">返回 Fellowship 方向</a>

            <p class="lead" style="margin-bottom: var(--space-2xl);" data-i18n data-en="A supportive, structured environment for early scholars to build foundational research and analytical skills." data-zh-hash="dioc8d">为早期学者构建基础科研与分析能力的结构化支持环境。</p>

            <div class="section-header">
                <span class="section-number" data-i18n data-en="01 &middot; Format" data-zh-hash="i0g8fp">01 · 形式</span>
                <h2 data-i18n data-en="Participation formats." data-zh-hash="hf1d93">参与形式。</h2>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-xl);">
                <div class="opportunity-card">
                    <h4 style="color: var(--lpi-blue); text-transform: uppercase; font-family: var(--font-sans); font-size: 0.78rem; letter-spacing: 0.14em; margin-bottom: var(--space-sm); font-weight: 600;" data-i18n data-en="Summer Intensive" data-zh-hash="dd9xim">暑期密集</h4>
                    <h3 style="margin-bottom: var(--space-sm);" data-i18n data-en="8&ndash;12 weeks" data-zh-hash="9vy744">8–12 周</h3>
                    <p data-i18n data-en="20+ hours per week of committed engagement. Immersive, cohort-based, and closely supervised." data-zh-hash="zfd05d">每周 20+ 小时的深度投入。沉浸式、同伴共学、密切督导。</p>
                </div>
                <div class="opportunity-card">
                    <h4 style="color: var(--lpi-blue); text-transform: uppercase; font-family: var(--font-sans); font-size: 0.78rem; letter-spacing: 0.14em; margin-bottom: var(--space-sm); font-weight: 600;" data-i18n data-en="Academic Term" data-zh-hash="dvxlp">学期制</h4>
                    <h3 style="margin-bottom: var(--space-sm);" data-i18n data-en="4&ndash;5 months" data-zh-hash="8079oo">4–5 个月</h3>
                    <p data-i18n data-en="10+ hours per week of structured engagement alongside coursework, with regular advising checkpoints." data-zh-hash="7ronr9">每周 10+ 小时与课业并行的结构化投入，并有定期的导师复盘节点。</p>
                </div>
            </div>

            <aside class="donation-portal" style="margin-top: var(--space-3xl);">
                <h3 data-i18n data-en="Ready to Begin?" data-zh-hash="cnhkbr">准备好开始了吗？</h3>
                <p style="color: color-mix(in oklab, var(--paper) 90%, transparent); margin-bottom: var(--space-lg); max-width: 56ch;" data-i18n data-en="Applications are reviewed on a rolling basis. Make sure you have your academic transcripts and personal statement ready before you start." data-zh-hash="k75ju7">申请采取滚动审核。开始前请备好学业成绩单与个人陈述。</p>
                <a href="fellowship-application.html" class="btn btn--gold" data-i18n data-en="Access Application Form" data-zh-hash="4zi9ay">进入申请表</a>
