<!DOCTYPE html>
<html lang="zh-CN" data-title-en="Get Involved | ConnectEd Research Institute">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加入我们 | ConnectEd Research Institute</title>
    <meta name="description" content="Support ConnectEd as a faculty mentor, volunteer, or institutional partner. Submit your interest form to help expand access to research.">
    <meta property="og:title" content="Get Involved | ConnectEd Research Institute">
    <meta property="og:description" content="Ways to contribute: faculty mentorship, volunteering, and institutional partnership.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page="get-involved">

    <div id="site-nav"></div>

    <header class="hero hero--centered">
        <div class="hero-content">
            <span class="eyebrow" data-i18n data-en="Join the Mission" data-zh-hash="arh8wz">加入使命</span>
            <h1 data-i18n data-en="Join us." data-zh-hash="lf0cxq">加入我们。</h1>
            <p data-i18n data-en="Mentor a fellow, support operations, or partner as an institution. The mission only grows with people who truly commit." data-zh-hash="8yj4g4">指导一位 fellow、支持运营工作，或以机构身份建立合作。使命的壮大，有赖于每一个真正投入其中的人。</p>
        </div>
    </header>

    <section>
        <div class="container">
            <div class="section-header">
                <span class="section-number" data-i18n data-en="01 &middot; Ways to Contribute" data-zh-hash="n0wa46">01 · 参与方式</span>
                <h2 data-i18n data-en="Three ways to support the work." data-zh-hash="s3atxm">三种支持方式。</h2>
            </div>

            <div class="opportunity-grid">
                <div class="opportunity-card opportunity-card--photo">
                    <div class="photo-card__media">
                        <img src="https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&amp;fit=crop&amp;q=80&amp;w=900" alt="A faculty mentor working with a student researcher">
                    </div>
                    <i class="fas fa-user-tie" aria-hidden="true"></i>
                    <div class="photo-card__body">
                        <h3 data-i18n data-en="Faculty Mentors" data-zh-hash="d6ei6z">教师导师</h3>
                        <p data-i18n data-en="University faculty can participate by advising research fellows and providing guidance on academic projects." data-zh-hash="kx31q7">大学教师可以通过指导 research fellow、为学术项目提供建议等方式参与。</p>
                    </div>
                </div>

                <div class="opportunity-card opportunity-card--photo">
                    <div class="photo-card__media">
                        <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&amp;fit=crop&amp;q=80&amp;w=900" alt="Volunteers working together around a table">
                    </div>
                    <i class="fas fa-hands-helping" aria-hidden="true"></i>
                    <div class="photo-card__body">
                        <h3 data-i18n data-en="Volunteers" data-zh-hash="eilrx">志愿者</h3>
                        <p data-i18n data-en="Professionals and graduate students can support our operations through administrative and program assistance." data-zh-hash="2gqef8">业界专业人士与研究生可以通过行政与项目协助支持我们的运营。</p>
                    </div>
                </div>

                <div class="opportunity-card opportunity-card--photo">
                    <div class="photo-card__media">
                        <img src="https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&amp;fit=crop&amp;q=80&amp;w=900" alt="Students celebrating at an academic ceremony">
                    </div>
                    <i class="fas fa-hand-holding-heart" aria-hidden="true"></i>
                    <div class="photo-card__body">
                        <h3 data-i18n data-en="Supporters" data-zh-hash="l3ni8">资助者</h3>
                        <p data-i18n data-en="Financial contributions help provide fellowships and learning resources to students with limited institutional access." data-zh-hash="od08g2">经济支持可以为缺乏机构资源渠道的学生提供 fellowship 与学习资源。</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="form-section">
        <div class="container">
            <div class="section-header">
                <span class="section-number" data-i18n data-en="02 &middot; Interest Form" data-zh-hash="4totof">02 · 意向表</span>
                <h2 data-i18n data-en="Submit an interest form." data-zh-hash="c4cf8w">提交意向表。</h2>
            </div>

            <div class="interest-form">
                <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                    <input type="hidden" name="_subject" value="New ConnectEd Interest Form Submission">
                    <div class="form-group">
                        <label for="name" data-i18n data-en="Full Name" data-zh-hash="fqmy">姓名</label>
                        <input type="text" id="name" name="Name" required>
                    </div>
                    <div class="form-group">
                        <label for="email" data-i18n data-en="Email Address" data-zh-hash="irh79v">邮箱地址</label>
                        <input type="email" id="email" name="Email" required>
                    </div>
                    <div class="form-group">
                        <label for="role" data-i18n data-en="Desired Role" data-zh-hash="k5j0lz">希望参与的角色</label>
                        <select id="role" name="Role">
                            <option value="Mentor" data-opt-en="Faculty Mentor">教师导师</option>
                            <option value="Volunteer" data-opt-en="Volunteer">志愿者</option>
                            <option value="Partner" data-opt-en="Institutional Partner">机构合作方</option>
                            <option value="Other" data-opt-en="Other">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="skills" data-i18n data-en="Key Skills" data-zh-hash="afu8wz">主要技能</label>
                        <input type="text" id="skills" name="Skills" placeholder="例如：数据分析、写作、网页设计" data-ph-en="e.g., Data Analysis, Writing, Web Design">
                    </div>
                    <div class="form-group">
                        <label for="availability" data-i18n data-en="Time Availability" data-zh-hash="88zufl">时间可用度</label>
                        <input type="text" id="availability" name="Availability" placeholder="例如：每月 2 小时" data-ph-en="e.g., 2 hours per month">
                    </div>
                    <div class="form-group">
                        <label for="interests" data-i18n data-en="Primary Interests" data-zh-hash="afrf11">主要兴趣</label>
                        <textarea id="interests" name="Interests" rows="4" placeholder="你对哪些角色或方向最感兴趣？" data-ph-en="Which roles or areas are you most interested in?"></textarea>
                    </div>
                    <button type="submit" class="btn-submit" data-i18n data-en="Submit Formal Interest" data-zh-hash="nz1ohq">正式提交意向</button>
                </form>
            </div>
        </div>
    </section>

    <div id="site-footer"></div>

    <script src="assets/lang.js"></script>
    <script src="assets/components.js"></script>
</body>
</html>
