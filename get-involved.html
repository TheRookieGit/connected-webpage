<!DOCTYPE html>
<html lang="zh-CN" data-title-en="Get Involved | ConnectEd Research Institute">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加入我们 | ConnectEd Research Institute</title>
    <meta name="description" content="Support ConnectEd as a faculty mentor, volunteer, or institutional partner. Submit your interest form to help expand access to research.">
    <meta property="og:title" content="Get Involved | ConnectEd Research Institute">
    <meta property="og:description" content="Ways to contribute: faculty mentorship, volunteering, and institutional partnership.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page="get-involved">

    <div id="site-nav"></div>

    <header class="hero hero--centered">
        <div class="hero-content">
            <span class="eyebrow" data-i18n data-en="Join the Mission" data-zh-hash="arh8wz">加入使命</span>
            <h1 data-i18n data-en="Join us." data-zh-hash="arkdj4">加入我们</h1>
            <p data-i18n data-en="Mentor a fellow, support operations, or partner as an institution. The mission only grows with people who truly commit." data-zh-hash="8yj4g4">指导一位 fellow、支持运营工作，或以机构身份建立合作。使命的壮大，有赖于每一个真正投入其中的人。</p>
        </div>
    </header>

    <section>
        <div class="container">
            <div class="section-header">
                <h2 data-i18n data-en="Three ways to support the work." data-zh-hash="s3atxm">三种支持方式。</h2>
            </div>

            <div class="opportunity-grid">
                <div class="opportunity-card opportunity-card--photo">
                    <div class="photo-card__media">
                        <img src="https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&amp;fit=crop&amp;q=80&amp;w=900" alt="A faculty mentor working with a student researcher">
                    </div>
                    <i class="fas fa-user-tie" aria-hidden="true"></i>
                    <div class="photo-card__body">
                        <h3 data-i18n data-en="Faculty Mentors" data-zh-hash="d6ei6z">教师导师</h3>
                        <p data-i18n data-en="University faculty can participate by advising research fellows and providing guidance on academic projects." data-zh-hash="kx31q7">大学教师可以通过指导 research fellow、为学术项目提供建议等方式参与。</p>
                        <a href="#" class="btn" data-modal="mentor-modal" style="margin-top:auto; align-self:flex-start;" data-i18n data-en="Apply as Mentor" data-zh-hash="8u2c2u">申请成为导师</a>
                    </div>
                </div>

                <div class="opportunity-card opportunity-card--photo">
                    <div class="photo-card__media">
                        <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&amp;fit=crop&amp;q=80&amp;w=900" alt="Volunteers working together around a table">
                    </div>
                    <i class="fas fa-hands-helping" aria-hidden="true"></i>
                    <div class="photo-card__body">
                        <h3 data-i18n data-en="Volunteers" data-zh-hash="eilrx">志愿者</h3>
                        <p data-i18n data-en="Professionals and graduate students can support our operations through administrative and program assistance." data-zh-hash="2gqef8">业界专业人士与研究生可以通过行政与项目协助支持我们的运营。</p>
                        <a href="#" class="btn" data-modal="volunteer-modal" style="margin-top:auto; align-self:flex-start;" data-i18n data-en="Apply as Volunteer" data-zh-hash="a91eb3">申请成为志愿者</a>
                    </div>
                </div>

                <div class="opportunity-card opportunity-card--photo">
                    <div class="photo-card__media">
                        <img src="https://images.unsplash.com/photo-1568667256549-094345857637?auto=format&amp;fit=crop&amp;q=80&amp;w=900" alt="A university library reading room lined with books">
                    </div>
                    <i class="fas fa-hand-holding-heart" aria-hidden="true"></i>
                    <div class="photo-card__body">
                        <h3 data-i18n data-en="Supporters" data-zh-hash="l3ni8">资助者</h3>
                        <p data-i18n data-en="Financial contributions help provide fellowships and learning resources to students with limited institutional access." data-zh-hash="od08g2">经济支持可以为缺乏机构资源渠道的学生提供 fellowship 与学习资源。</p>
                        <a href="support.html#impact" class="btn" style="margin-top:auto; align-self:flex-start;" data-i18n data-en="See How to Support" data-zh-hash="gazwsb">了解支持方式</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="mentor-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="mentor-modal-title">
        <div class="modal-content modal-content--form">
            <button type="button" class="modal-close" aria-label="Close">&times;</button>
            <h3 id="mentor-modal-title" data-i18n data-en="Become a Mentor" data-zh-hash="cp662e">成为导师</h3>
            <p class="modal-intro" data-i18n data-en="Share a few details and we&rsquo;ll follow up shortly." data-zh-hash="nv6k61">请填写以下信息，我们会尽快与您联系。</p>
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <input type="hidden" name="_subject" value="New Mentor Application">
                <input type="hidden" name="Role" value="Faculty Mentor">
                <div class="form-group">
                    <label for="mentor-name" data-i18n data-en="Full Name" data-zh-hash="fqmy">姓名</label>
                    <input type="text" id="mentor-name" name="Name" required>
                </div>
                <div class="form-group">
                    <label for="mentor-email" data-i18n data-en="Email" data-zh-hash="padf">邮箱</label>
                    <input type="email" id="mentor-email" name="Email" required>
                </div>
                <div class="form-group">
                    <label for="mentor-institution" data-i18n data-en="Institution" data-zh-hash="cs5cfc">所属机构</label>
                    <input type="text" id="mentor-institution" name="Institution">
                </div>
                <div class="form-group">
                    <label for="mentor-area" data-i18n data-en="Research Area" data-zh-hash="fnweij">研究领域</label>
                    <input type="text" id="mentor-area" name="Research_Area">
                </div>
                <div class="form-group">
                    <label for="mentor-message" data-i18n data-en="Message" data-zh-hash="kptz">留言</label>
                    <textarea id="mentor-message" name="Message" rows="4"></textarea>
                </div>
                <button type="submit" class="btn-submit" data-i18n data-en="Submit Application" data-zh-hash="cxay9k">提交申请</button>
            </form>
        </div>
    </div>

    <div id="volunteer-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="volunteer-modal-title">
        <div class="modal-content modal-content--form">
            <button type="button" class="modal-close" aria-label="Close">&times;</button>
            <h3 id="volunteer-modal-title" data-i18n data-en="Become a Volunteer" data-zh-hash="whriy5">成为志愿者</h3>
            <p class="modal-intro" data-i18n data-en="Share a few details and we&rsquo;ll follow up shortly." data-zh-hash="nv6k61">请填写以下信息，我们会尽快与您联系。</p>
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <input type="hidden" name="_subject" value="New Volunteer Application">
                <input type="hidden" name="Role" value="Volunteer">
                <div class="form-group">
                    <label for="vol-name" data-i18n data-en="Full Name" data-zh-hash="fqmy">姓名</label>
                    <input type="text" id="vol-name" name="Name" required>
                </div>
                <div class="form-group">
                    <label for="vol-email" data-i18n data-en="Email" data-zh-hash="padf">邮箱</label>
                    <input type="email" id="vol-email" name="Email" required>
                </div>
                <div class="form-group">
                    <label for="vol-skills" data-i18n data-en="Key Skills" data-zh-hash="afu8wz">主要技能</label>
                    <input type="text" id="vol-skills" name="Skills" placeholder="例如：数据分析、写作、网页设计" data-ph-en="e.g., Data Analysis, Writing, Web Design">
                </div>
                <div class="form-group">
                    <label for="vol-availability" data-i18n data-en="Time Availability" data-zh-hash="88zufl">时间可用度</label>
                    <input type="text" id="vol-availability" name="Availability" placeholder="例如：每月 2 小时" data-ph-en="e.g., 2 hours per month">
                </div>
                <div class="form-group">
                    <label for="vol-interests" data-i18n data-en="Primary Interests" data-zh-hash="av34h3">兴趣方向</label>
                    <textarea id="vol-interests" name="Interests" rows="4" placeholder="你对哪些方向最感兴趣？" data-ph-en="Which areas are you most interested in?"></textarea>
                </div>
                <button type="submit" class="btn-submit" data-i18n data-en="Submit Application" data-zh-hash="cxay9k">提交申请</button>
            </form>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="assets/lang.js"></script>
    <script src="assets/components.js"></script>
</body>
</html>
