<!DOCTYPE html>
<html lang="zh-CN" data-title-en="Support | ConnectEd Research Institute">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支持我们 | ConnectEd Research Institute</title>
    <meta name="description" content="Support ConnectEd's mission with a one-time or monthly pledge. Your contribution funds fellowship awards, mentorship infrastructure, and training resources.">
    <meta property="og:title" content="Support | ConnectEd Research Institute">
    <meta property="og:description" content="Pledge support for fellowships, mentorship, and research training for emerging scholars.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page="support">

    <div id="site-nav"></div>

    <!-- ============================================================
         SECTION 1 — Pitch + ledger in one viewport
         ============================================================ -->
    <header class="pledge-hero">
        <div class="pledge-hero__inner">
            <div class="pledge-hero__meta">
                <span data-i18n data-en="Support" data-zh-hash="hv001">支持我们</span>
                <span class="pledge-hero__sep">·</span>
                <span data-i18n data-en="501(c)(3) nonprofit" data-zh-hash="hv002">501(c)(3) 非营利机构</span>
            </div>

            <div class="pledge-hero__main">
                <h1>
                    <span class="pledge-hero__h1-line" data-i18n data-en="A seat at the table," data-zh-hash="hv003a">一把递过去的椅子，</span>
                    <span class="pledge-hero__h1-line pledge-hero__h1-line--italic" data-i18n data-en="funded one pledge at a time." data-zh-hash="hv003b">由一次次认捐撑起。</span>
                </h1>
                <p class="pledge-hero__lede" data-i18n data-en="Your gift underwrites research fellowships, mentorship, and training for first-generation, international, and underrepresented scholars who would otherwise have no path into a research environment." data-zh-hash="hv004">你的捐赠用于资助第一代大学生、国际学生与代表性不足学者的研究 fellowship、导师指导与科研培训——他们原本没有路径进入科研环境。</p>
            </div>

            <ol class="pledge-hero__ledger">
                <li>
                    <span class="pledge-hero__ledger-amt">$20</span>
                    <span class="pledge-hero__ledger-cap" data-i18n data-en="One mentor hour" data-zh-hash="hv010">一小时导师指导</span>
                </li>
                <li>
                    <span class="pledge-hero__ledger-amt">$90</span>
                    <span class="pledge-hero__ledger-cap" data-i18n data-en="One application supported" data-zh-hash="hv011">一份完整申请支持</span>
                </li>
                <li>
                    <span class="pledge-hero__ledger-amt">$200</span>
                    <span class="pledge-hero__ledger-cap" data-i18n data-en="One workshop seat" data-zh-hash="hv012">一席工作坊</span>
                </li>
            </ol>

            <a href="#" class="pledge-hero__cta" data-modal="pledge-modal">
                <span data-i18n data-en="Pledge now" data-zh-hash="hv020">立即认捐</span>
                <i class="fas fa-arrow-right" aria-hidden="true"></i>
            </a>
        </div>
    </header>

    <!-- ============================================================
         PLEDGE MODAL — opens from CTA, blurs page behind
         ============================================================ -->
    <div id="pledge-modal" class="modal pledge-modal" role="dialog" aria-modal="true" aria-labelledby="pledge-modal-title">
        <div class="modal-content pledge-modal__content">
            <button type="button" class="modal-close pledge-modal__close" aria-label="Close">&times;</button>
            <div class="pledge__inner">

            <div class="pledge__head">
                <span class="pledge__eyebrow" data-i18n data-en="Make your pledge" data-zh-hash="pl001">提交认捐</span>
                <h2 id="pledge-modal-title" data-i18n data-en="Choose a contribution." data-zh-hash="pl002">选择你的支持方式。</h2>
            </div>

            <form class="pledge__form" id="pledge-form" novalidate
                  data-stripe-mode="checkout"
                  data-stripe-currency="usd">

                <!-- Frequency: typographic toggle -->
                <div class="pledge__freq" role="radiogroup" aria-label="Pledge frequency">
                    <label class="pledge__freq-opt is-active">
                        <input type="radio" name="frequency" value="once" checked>
                        <span data-i18n data-en="Once" data-zh-hash="pl010">单次</span>
                    </label>
                    <span class="pledge__freq-sep" aria-hidden="true">/</span>
                    <label class="pledge__freq-opt">
                        <input type="radio" name="frequency" value="monthly">
                        <span data-i18n data-en="Monthly" data-zh-hash="pl011">月度</span>
                    </label>
                </div>

                <!-- Amount tiles + custom -->
                <div class="pledge__amounts" role="radiogroup" aria-label="Pledge amount">
                    <label class="pledge__amt-opt">
                        <input type="radio" name="amount" value="10">
                        <span class="pledge__amt-fig">$10</span>
                    </label>
                    <label class="pledge__amt-opt is-active">
                        <input type="radio" name="amount" value="20" checked>
                        <span class="pledge__amt-fig">$20</span>
                    </label>
                    <label class="pledge__amt-opt">
                        <input type="radio" name="amount" value="45">
                        <span class="pledge__amt-fig">$45</span>
                    </label>
                    <label class="pledge__amt-opt">
                        <input type="radio" name="amount" value="90">
                        <span class="pledge__amt-fig">$90</span>
                    </label>
                    <label class="pledge__amt-opt">
                        <input type="radio" name="amount" value="130">
                        <span class="pledge__amt-fig">$130</span>
                    </label>
                    <label class="pledge__amt-opt">
                        <input type="radio" name="amount" value="200">
                        <span class="pledge__amt-fig">$200</span>
                    </label>
                    <label class="pledge__amt-opt pledge__amt-opt--custom">
                        <input type="radio" name="amount" value="custom">
                        <span class="pledge__amt-fig">$ <input
                            type="number"
                            name="custom_amount"
                            id="custom_amount"
                            min="1" step="1"
                            inputmode="numeric"
                            placeholder="自定义金额"
                            data-ph-en="Custom amount"
                            aria-label="Custom amount"></span>
                    </label>
                </div>

                <!-- Submit -->
                <button type="submit" class="pledge__submit">
                    <span class="pledge__submit-label" data-i18n data-en="Continue to secure checkout" data-zh-hash="pl040">前往安全支付</span>
                    <span class="pledge__submit-arrow" aria-hidden="true">→</span>
                </button>

                <p class="pledge__submit-note">
                    <i class="fas fa-lock" aria-hidden="true"></i>
                    <span data-i18n data-en="Tax-deductible. Processed by Stripe. Cancel anytime." data-zh-hash="pl041">可抵税 · 由 Stripe 处理 · 可随时取消</span>
                </p>

                <div class="pledge__status" id="pledge-status" role="status" aria-live="polite"></div>
            </form>

            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="assets/lang.js"></script>
    <script src="assets/components.js"></script>

    <script>
    /* ============================================================
       PLEDGE FORM — Stripe Checkout integration point
       ------------------------------------------------------------
       When ready: deploy a server endpoint that accepts
         { amount(cents), frequency, dedication }
       and returns { url } from stripe.checkout.sessions.create().
       Then set window.STRIPE_CHECKOUT_ENDPOINT below.
       ============================================================ */
    window.STRIPE_CHECKOUT_ENDPOINT = ''; // e.g. '/api/create-checkout-session'

    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('pledge-form');
        if (!form) return;

        const status   = document.getElementById('pledge-status');
        const customIn = document.getElementById('custom_amount');

        const freqOpts = form.querySelectorAll('.pledge__freq-opt');
        freqOpts.forEach(opt => {
            opt.addEventListener('click', () => {
                freqOpts.forEach(o => o.classList.remove('is-active'));
                opt.classList.add('is-active');
            });
        });

        const amtOpts = form.querySelectorAll('.pledge__amt-opt');
        const setActiveAmount = (target) => {
            amtOpts.forEach(o => o.classList.remove('is-active'));
            target.classList.add('is-active');
        };
        amtOpts.forEach(opt => {
            const radio = opt.querySelector('input[type="radio"]');
            opt.addEventListener('click', (e) => {
                if (e.target === customIn) return;
                radio.checked = true;
                setActiveAmount(opt);
                if (radio.value !== 'custom') customIn.value = '';
            });
        });
        customIn.addEventListener('focus', () => {
            const customOpt = customIn.closest('.pledge__amt-opt');
            customOpt.querySelector('input[type="radio"]').checked = true;
            setActiveAmount(customOpt);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            status.textContent = '';
            status.classList.remove('is-error');

            const data = new FormData(form);
            let amount = data.get('amount');
            if (amount === 'custom') amount = (data.get('custom_amount') || '').trim();
            const numeric = Number(amount);

            if (!numeric || numeric < 1) {
                status.textContent = (document.documentElement.lang === 'en')
                    ? 'Please enter a valid pledge amount.'
                    : '请填写有效的认捐金额。';
                status.classList.add('is-error');
                return;
            }

            const payload = {
                amount: Math.round(numeric * 100),
                frequency: data.get('frequency')
            };
            const endpoint = window.STRIPE_CHECKOUT_ENDPOINT;

            if (!endpoint) {
                status.textContent = (document.documentElement.lang === 'en')
                    ? `Pledge prepared: $${numeric} (${payload.frequency}). Stripe checkout will open here once connected.`
                    : `已准备认捐：$${numeric}（${payload.frequency === 'monthly' ? '月度' : '单次'}）。Stripe 接入后将开启安全支付。`;
                return;
            }

            try {
                const btn = form.querySelector('.pledge__submit');
                btn.disabled = true;
                btn.classList.add('is-loading');
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('checkout_failed');
                const { url } = await res.json();
                window.location.href = url;
            } catch (err) {
                status.textContent = (document.documentElement.lang === 'en')
                    ? 'Something went wrong starting checkout. Please try again or email give@connected-research.org.'
                    : '启动支付时出现问题，请稍后重试，或来信 give@connected-research.org。';
                status.classList.add('is-error');
                const btn = form.querySelector('.pledge__submit');
                btn.disabled = false;
                btn.classList.remove('is-loading');
            }
        });
    });
    </script>
</body>
</html>
