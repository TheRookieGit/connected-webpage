<!DOCTYPE html>
<html lang="zh-CN" data-title-en="Support | ConnectEd Research Institute">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支持我们 | ConnectEd Research Institute</title>
    <meta name="description" content="Support ConnectEd's mission with a one-time or monthly donation. Your contribution funds fellowship awards, mentorship infrastructure, and training resources.">
    <meta property="og:title" content="Support | ConnectEd Research Institute">
    <meta property="og:description" content="Donate to fund fellowships, mentorship, and research training for emerging scholars.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page="support">

    <div id="site-nav"></div>

    <header class="page-header page-header--image" style="--ph-image: url('https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&amp;fit=crop&amp;q=80&amp;w=1800');">
        <span class="eyebrow" data-i18n data-en="Fund the Mission" data-zh-hash="d6bqc0">支持使命</span>
        <h1 data-i18n data-en="Support students who&rsquo;d otherwise be locked out." data-zh-hash="wngkd1">支持那些本可能被挡在门外的学生。</h1>
        <p data-i18n data-en="Every fellowship funded is a seat at a table someone wouldn&rsquo;t otherwise have been offered." data-zh-hash="3awwgl">每一笔 fellowship 资助，都是一把原本不会被递过去的椅子。</p>
    </header>

    <section>
        <div class="container">
            <div class="support-grid">

                <div class="support-text">
                    <div class="section-header">
                        <span class="section-number" data-i18n data-en="01 &middot; Impact" data-zh-hash="i0g6ro">01 · 影响</span>
                        <h2 data-i18n data-en="Your support expands access." data-zh-hash="yxblol">你的支持扩展科研可及性。</h2>
                    </div>

                    <figure class="feature-image" style="aspect-ratio: 4 / 3; margin-bottom: var(--space-lg);">
                        <img src="https://images.unsplash.com/photo-1523580846011-d3a5bc25702b?auto=format&amp;fit=crop&amp;q=80&amp;w=1200" alt="A scholar at work in a university research setting">
                    </figure>

                    <p data-i18n data-en="Your support helps expand access to research mentorship and fellowship funding for emerging scholars committed to educational equity — particularly for students who would otherwise have no path into a research environment." data-zh-hash="9l65vc">你的支持帮助我们为致力于教育公平的成长期学者扩展科研导师资源与 fellowship 资金——尤其是那些原本没有路径进入科研环境的学生。</p>

                    <div class="section-header" style="margin-top: var(--space-2xl);">
                        <span class="section-number" data-i18n data-en="02 &middot; Allocation" data-zh-hash="dboqi2">02 · 资金去向</span>
                        <h2 data-i18n data-en="Where your donation goes." data-zh-hash="pmr7of">你的捐赠去了哪里。</h2>
                    </div>
                    <ul class="check-list">
                        <li data-i18n data-en="Research Fellowship awards and scholar support." data-zh-hash="pcgw0r">研究 Fellowship 奖学金与学者支持。</li>
                        <li data-i18n data-en="Mentorship infrastructure and program coordination." data-zh-hash="llayzr">导师体系与项目统筹。</li>
                        <li data-i18n data-en="Research training resources and pilot learning initiatives." data-zh-hash="5qjupo">科研培训资源与试点学习项目。</li>
                    </ul>
                </div>

                <aside class="donation-portal">
                    <h3 data-i18n data-en="Secure Donation Portal" data-zh-hash="9nl0lv">安全捐赠入口</h3>
                    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                        <input type="hidden" name="_subject" value="New ConnectEd Donation Intent">
                        <div class="form-group">
                            <label for="amount" data-i18n data-en="Choose Donation Amount" data-zh-hash="thzzss">选择捐赠金额</label>
                            <select name="Donation_Amount" id="amount" required>
                                <option value="" disabled selected data-opt-en="Select an amount">请选择金额</option>
                                <option value="$25" data-opt-en="$25">$25</option>
                                <option value="$50" data-opt-en="$50">$50</option>
                                <option value="$100" data-opt-en="$100">$100</option>
                                <option value="$250" data-opt-en="$250">$250</option>
                                <option value="Other" data-opt-en="Other">其他</option>
                            </select>
                        </div>

                        <div class="form-group" id="other-amount-div" style="display:none;">
                            <label for="other_val" data-i18n data-en="Enter Custom Amount ($)" data-zh-hash="n4af9b">输入自定义金额（美元）</label>
                            <input type="number" name="Custom_Amount" id="other_val" placeholder="例如：500" data-ph-en="e.g., 500">
                        </div>

                        <label class="monthly-checkbox">
                            <input type="checkbox" name="Monthly_Donation" value="Yes"> <span data-i18n data-en="Make this a monthly donation" data-zh-hash="377b12">设为月度捐赠</span>
                        </label>

                        <button type="submit" class="btn-submit btn-gold" data-i18n data-en="Complete Donation" data-zh-hash="byj7kk">完成捐赠</button>
                    </form>
                    <p style="margin-top: 15px; font-size: 0.8rem; opacity: 0.85;" data-i18n data-en="Note: submitting this form notifies our team. Secure card processing will be connected soon." data-zh-hash="wwj27m">说明：提交本表单会通知我们的团队。安全的银行卡处理将尽快接入。</p>
                </aside>

            </div>
        </div>
    </section>

    <div id="site-footer"></div>

    <script src="assets/lang.js"></script>
    <script src="assets/components.js"></script>
    <script>
        // Reveal custom amount field when "Other" is selected
        document.addEventListener('DOMContentLoaded', () => {
            const amount = document.getElementById('amount');
            const otherDiv = document.getElementById('other-amount-div');
            const otherInput = document.getElementById('other_val');
            amount.addEventListener('change', () => {
                if (amount.value === 'Other') {
                    otherDiv.style.display = 'block';
                    otherInput.setAttribute('required', 'required');
                } else {
                    otherDiv.style.display = 'none';
                    otherInput.removeAttribute('required');
                }
            });
        });
    </script>
</body>
</html>
