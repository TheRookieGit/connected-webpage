<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | ConnectEd Research Institute</title>
    <meta name="description" content="Get in touch with ConnectEd Research Institute about fellowships, collaborations, volunteer opportunities, or general inquiries.">
    <meta property="og:title" content="Contact | ConnectEd Research Institute">
    <meta property="og:description" content="Reach our team about fellowships, collaborations, and volunteering.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body[data-page="contact"] {
            background:
                linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0.55)),
                url("https://images.unsplash.com/photo-1542435503-956c469947f6?q=80&w=1548&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D")
                85% -150px / 160% fixed no-repeat;
        }

        /* ── Hero ── */
        .contact-hero {
            min-height: calc(48vh - 80px);
            display: flex;
            align-items: flex-start;
            padding: clamp(28px,4vw,48px) var(--edge-x) clamp(28px,4vw,44px);
            background: transparent;
            border-bottom: 1px solid var(--hairline);
        }

        .contact-hero__inner {
            max-width: var(--max-content);
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-rows: auto 1fr auto auto;
            gap: clamp(20px,3vw,36px);
        }

        .contact-hero__meta {
            display: flex;
            gap: var(--space-sm);
            align-items: center;
            font-family: var(--font-display);
            font-style: italic;
            font-size: 0.88rem;
            color: var(--ink-muted);
            padding-bottom: var(--space-sm);
            border-bottom: 1px solid var(--hairline);
        }

        .contact-hero__main {
            display: grid;
            grid-template-columns: minmax(0,1.45fr) minmax(0,1fr);
            gap: clamp(32px,6vw,80px);
            align-items: center;
        }

        .contact-hero__main h1 {
            font-size: clamp(2.2rem,1.2rem + 4.2vw,4.4rem);
            line-height: 1.02;
            letter-spacing: -0.025em;
            font-weight: 400;
            text-wrap: balance;
        }

        .contact-hero__h1-line { display: block; }

        .contact-hero__h1-line--italic {
            font-style: italic;
            color: var(--lpi-blue);
            padding-left: clamp(12px,3vw,48px);
        }

        .contact-hero__lede {
            font-size: var(--step-0);
            line-height: 1.55;
            color: var(--ink-soft);
            max-width: 42ch;
        }

        .contact-hero__ledger {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            border-top: 1px solid var(--lpi-navy);
            border-bottom: 1px solid var(--hairline);
        }

        .contact-hero__ledger li {
            padding: clamp(14px,2vw,22px) clamp(12px,2vw,24px);
            display: flex;
            align-items: baseline;
            gap: clamp(10px,1.5vw,18px);
            border-right: 1px solid var(--hairline);
        }

        .contact-hero__ledger li:last-child { border-right: none; }

        .contact-hero__ledger-label {
            font-family: var(--font-display);
            font-weight: 300;
            font-size: clamp(0.85rem,0.7rem + 0.5vw,1rem);
            letter-spacing: -0.01em;
            color: var(--lpi-navy);
            line-height: 1;
            flex-shrink: 0;
        }

        .contact-hero__ledger-cap {
            font-family: var(--font-display);
            font-style: italic;
            font-size: 0.88rem;
            color: var(--ink-soft);
            line-height: 1.3;
        }

        .contact-hero__cta {
            justify-self: start;
            display: inline-flex;
            align-items: center;
            gap: var(--space-md);
            padding: clamp(14px,1.6vw,18px) clamp(24px,3vw,36px);
            background: var(--lpi-navy);
            color: #fff;
            text-decoration: none;
            font-family: var(--font-display);
            font-size: clamp(1rem,0.9rem + 0.4vw,1.2rem);
            font-weight: 500;
            letter-spacing: -0.005em;
            transition: background 0.2s ease, gap 0.2s ease, transform 0.2s ease;
        }

        .contact-hero__cta:hover {
            background: var(--lpi-blue);
            gap: calc(var(--space-md) + 6px);
            transform: translateY(-1px);
        }

        .contact-hero__cta i { font-size: 0.85em; color: var(--lpi-gold); }

        /* ── Contact Form Section ── */
        .contact-form-section {
            padding: clamp(48px,7vw,96px) var(--edge-x);
            background: var(--paper);
            border-bottom: 1px solid var(--hairline);
        }

        .contact-form-section__inner {
            max-width: var(--max-content);
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0,1fr) minmax(0,1.6fr);
            gap: clamp(32px,6vw,80px);
            align-items: start;
        }

        .contact-form-section__aside {}

        .contact-form-section__label {
            font-family: var(--font-display);
            font-style: italic;
            font-size: clamp(1.6rem,1rem + 2vw,2.4rem);
            font-weight: 300;
            letter-spacing: -0.02em;
            color: var(--lpi-navy);
            line-height: 1.15;
            margin-bottom: clamp(20px,3vw,36px);
        }

        .contact-email-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .contact-email-list li {
            padding: clamp(10px,1.5vw,16px) 0;
            border-bottom: 1px solid var(--hairline);
            font-size: 0.9rem;
            color: var(--ink-soft);
            line-height: 1.4;
        }

        .contact-email-list li:first-child { border-top: 1px solid var(--hairline); }

        .contact-email-list strong {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink-muted);
            margin-bottom: 3px;
        }

        .contact-email-list a {
            color: var(--lpi-blue);
            text-decoration: none;
        }

        .contact-email-list a:hover { text-decoration: underline; }

        /* Form */
        .contact-form-box {}

        .contact-form-box h3 {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--ink);
            margin-bottom: clamp(20px,3vw,32px);
            padding-bottom: var(--space-sm);
            border-bottom: 1px solid var(--lpi-navy);
        }

        .contact-form-box .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: clamp(14px,2vw,20px);
        }

        .contact-form-box label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-muted);
        }

        .contact-form-box input,
        .contact-form-box select,
        .contact-form-box textarea {
            font-family: var(--font-sans);
            font-size: var(--step-0);
            color: var(--ink);
            background: transparent;
            border: none;
            border-bottom: 1.5px solid var(--hairline);
            padding: 8px 0;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        .contact-form-box input:focus,
        .contact-form-box select:focus,
        .contact-form-box textarea:focus {
            border-bottom-color: var(--lpi-navy);
        }

        .contact-form-box input::placeholder,
        .contact-form-box textarea::placeholder {
            color: var(--ink-muted);
            font-style: italic;
        }

        .contact-form-box textarea { resize: vertical; min-height: 120px; }

        .contact-form-box select { appearance: none; cursor: pointer; }

        .contact-form-box .btn-submit {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            margin-top: clamp(8px,1.5vw,16px);
            padding: clamp(12px,1.4vw,16px) clamp(24px,3vw,36px);
            background: var(--lpi-gold);
            color: var(--lpi-navy);
            border: none;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .contact-form-box .btn-submit:hover {
            background: color-mix(in oklab, var(--lpi-gold) 80%, var(--lpi-navy));
            transform: translateY(-1px);
        }

        @media (max-width: 700px) {
            .contact-hero__main { grid-template-columns: 1fr; }
            .contact-hero__ledger { grid-template-columns: 1fr; }
            .contact-hero__ledger li { border-right: none; border-bottom: 1px solid var(--hairline); }
            .contact-hero__ledger li:last-child { border-bottom: none; }
            .contact-form-section__inner { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body data-page="contact">

    <div id="site-nav"></div>

    <header class="contact-hero">
        <div class="contact-hero__inner">

            <div class="contact-hero__meta">
                <span>Contact</span>
            </div>

            <div class="contact-hero__main">
                <h1>
                    <span class="contact-hero__h1-line">Get in</span>
                    <span class="contact-hero__h1-line contact-hero__h1-line--italic">Touch.</span>
                </h1>
                <p class="contact-hero__lede">Have questions about our fellowships, collaborations, or volunteer opportunities? Reach out and a member of our team will get back to you shortly.</p>
            </div>

            <a href="#contact-form" class="contact-hero__cta">
                Send a Message
                <i class="fas fa-arrow-down" aria-hidden="true"></i>
            </a>

        </div>
    </header>

    <!-- ── Contact Form Section ── -->
    <section class="contact-form-section" id="contact-form">
        <div class="contact-form-section__inner">

            <div class="contact-form-section__aside">
                <h2 class="contact-form-section__label">We'd love<br>to hear<br>from you.</h2>
                <ul class="contact-email-list">
                    <li>
                        <strong>General</strong>
                        <a href="mailto:admin@connect-edu.org">admin@connect-edu.org</a>
                    </li>
                </ul>
            </div>

            <div class="contact-form-box">
                <h3>Send a Message</h3>
                <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                    <input type="hidden" name="_subject" value="New ConnectEd Contact Message">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="Name" placeholder="First and Last Name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="Email" placeholder="yourname@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="topic">Topic</label>
                        <select id="topic" name="Topic" required>
                            <option value="" disabled selected>Select a topic</option>
                            <option value="Fellowships">Fellowships</option>
                            <option value="Collaboration">Collaboration</option>
                            <option value="Volunteer">Volunteer</option>
                            <option value="Donate">Donate</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group" id="other-topic-div" style="display:none;">
                        <label for="other_topic">Specify Topic</label>
                        <input type="text" id="other_topic" name="Other_Topic_Details" placeholder="Specify here">
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="Message" rows="6" placeholder="How can we help you?" required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">
                        Send Message
                        <i class="fas fa-arrow-right" aria-hidden="true"></i>
                    </button>
                </form>
            </div>

        </div>
    </section>

    <div id="site-footer"></div>

    <script src="assets/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const topic = document.getElementById('topic');
            const otherDiv = document.getElementById('other-topic-div');
            const otherInput = document.getElementById('other_topic');
            topic.addEventListener('change', () => {
                if (topic.value === 'Other') {
                    otherDiv.style.display = 'block';
                    otherInput.setAttribute('required', 'required');
                } else {
                    otherDiv.style.display = 'none';
                    otherInput.removeAttribute('required');
                }
            });
        });
    </script>
</body>
</html>
