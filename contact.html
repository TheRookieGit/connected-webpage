<!DOCTYPE html>
<html lang="zh-CN" data-title-en="Contact Us | ConnectEd Research Institute">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 | ConnectEd Research Institute</title>
    <meta name="description" content="Get in touch with ConnectEd Research Institute about fellowships, collaborations, volunteer opportunities, or general inquiries.">
    <meta property="og:title" content="Contact | ConnectEd Research Institute">
    <meta property="og:description" content="Reach our team about fellowships, collaborations, and volunteering.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page="contact">

    <div id="site-nav"></div>

    <header class="page-header page-header--image" style="--ph-image: url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&amp;fit=crop&amp;q=80&amp;w=1800');">
        <span class="eyebrow" data-i18n data-en="Reach Out" data-zh-hash="mihz">联系</span>
        <h1 data-i18n data-en="Contact us." data-zh-hash="kpt140">联系我们。</h1>
        <p data-i18n data-en="Fellowship questions, institutional partnerships, volunteering interest &mdash; we read everything that comes through." data-zh-hash="z91ary">Fellowship 咨询、机构合作、志愿者意向——我们会阅读每一条收到的消息。</p>
    </header>

    <section>
        <div class="container">
            <div class="contact-grid">

                <div class="contact-info">
                    <div class="section-header">
                        <span class="section-number" data-i18n data-en="01 &middot; Say Hello" data-zh-hash="l6r6ww">01 · 打个招呼</span>
                        <h2 data-i18n data-en="Get in touch." data-zh-hash="kpt140">联系我们。</h2>
                    </div>
                    <p style="font-size: var(--step-1); color: var(--ink-soft); margin-bottom: var(--space-lg);" data-i18n data-en="Have questions about our fellowships, collaborations, or volunteer opportunities? Please reach out through our contact form, and a member of our team will get back to you shortly." data-zh-hash="iw8mwx">对 fellowship、合作或志愿者机会有疑问？请通过联系表单留言，我们的团队成员会尽快回复。</p>
                    <p style="font-size: var(--step-1); color: var(--ink-soft);" data-i18n data-en-html="For specific inquiries, you can also email us directly at <br><strong>admin@connect-edu.org</strong>." data-zh-hash="tp5ycm">如需具体咨询，也可以直接邮件联系 <br><strong>admin@connect-edu.org</strong>。</p>
                </div>

                <div class="contact-form-container">
                    <h3 data-i18n data-en="Send a Message" data-zh-hash="b629ku">发送信息</h3>
                    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                        <input type="hidden" name="_subject" value="New ConnectEd Contact Message">
                        <div class="form-group">
                            <label for="name" data-i18n data-en="Name" data-zh-hash="fqmy">姓名</label>
                            <input type="text" id="name" name="Name" placeholder="姓与名" data-ph-en="First and Last Name" required>
                        </div>

                        <div class="form-group">
                            <label for="email" data-i18n data-en="Email" data-zh-hash="padf">邮箱</label>
                            <input type="email" id="email" name="Email" placeholder="yourname@email.com" data-ph-en="yourname@email.com" required>
                        </div>

                        <div class="form-group">
                            <label for="topic" data-i18n data-en="Topic" data-zh-hash="e56l">主题</label>
                            <select id="topic" name="Topic" required>
                                <option value="" disabled selected data-opt-en="Select a topic">请选择主题</option>
                                <option value="Fellowship" data-opt-en="Fellowship">Fellowship</option>
                                <option value="Collaboration" data-opt-en="Collaboration">合作</option>
                                <option value="Volunteer" data-opt-en="Volunteer">志愿者</option>
                                <option value="Donate" data-opt-en="Donate">捐赠</option>
                                <option value="Other" data-opt-en="Other">其他</option>
                            </select>
                        </div>

                        <div class="form-group" id="other-topic-div" style="display:none;">
                            <label for="other_topic" data-i18n data-en="Specify Topic" data-zh-hash="2wqz02">请说明主题</label>
                            <input type="text" id="other_topic" name="Other_Topic_Details" placeholder="在此说明" data-ph-en="Specify here">
                        </div>

                        <div class="form-group">
                            <label for="message" data-i18n data-en="Message" data-zh-hash="kptz">留言</label>
                            <textarea id="message" name="Message" rows="6" placeholder="我们可以如何帮助你？" data-ph-en="How can we help you?" required></textarea>
                        </div>

                        <button type="submit" class="btn-submit btn-gold" data-i18n data-en="Send Message" data-zh-hash="f1ow">发送</button>
                    </form>
                </div>

            </div>
        </div>
    </section>

    <div id="site-footer"></div>

    <script src="assets/lang.js"></script>
    <script src="assets/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const topic = document.getElementById('topic');
            const otherDiv = document.getElementById('other-topic-div');
            const otherInput = document.getElementById('other_topic');
            topic.addEventListener('change', () => {
                if (topic.value === 'Other') {
                    otherDiv.style.display = 'block';
                    otherInput.setAttribute('required', 'required');
                } else {
                    otherDiv.style.display = 'none';
                    otherInput.removeAttribute('required');
                }
            });
        });
    </script>
</body>
</html>
